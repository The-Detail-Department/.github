name: Agent configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: agent-configuration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned workflow auditor
        run: python3 -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Check workflow security and configuration
        run: zizmor --offline --strict-collection .github/workflows .github/dependabot.yml
