name: Task
description: A piece of work to be built
labels: ["task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true once this is done?
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why now
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: How we will know it worked
      description: The check, receipt or test that proves it.
    validations: { required: true }
  - type: textarea
    id: outofscope
    attributes:
      label: Explicitly out of scope
  - type: textarea
    id: ownership
    attributes:
      label: Source and ownership
      description: Target repository, current base commit and owned files. Identify overlapping work.
  - type: textarea
    id: authority
    attributes:
      label: Execution authority
      description: Record the authority already supplied for implementation, merge, deployment or provider actions.
