version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 2
    groups:
      workflow-tools:
        patterns: ["*"]
